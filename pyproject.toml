[project]
name = "streamlit-optimum-convertor"
version = "0.1.0"
description = "Démo pipo d'un convertisseur .xml optimum utilisé par des assureur en .pdf"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fpdf2>=2.8.7",
    "pydantic>=2.13.3",
    "streamlit>=1.61.0",
    "typer[all]>=0.27.1",
]

[dependency-groups]
dev = [
    "prek>=0.4.12",
    "pytest>=7.0.0",
    "ruff>=0.16",
    "ty>=0.0.66",
]

[tool.pytest.ini_options]
pythonpath = "."
